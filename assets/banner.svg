<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a10" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Filters for Glow & Shadows -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .node-pulse {
        animation: pulse 3s infinite ease-in-out;
      }
      .node-pulse-delayed {
        animation: pulse 3s infinite ease-in-out 1.5s;
      }
      .dash-flow {
        stroke-dasharray: 8, 8;
        animation: dash 20s linear infinite;
      }
      .orb-float-1 {
        animation: floatOne 10s ease-in-out infinite alternate;
      }
      .orb-float-2 {
        animation: floatTwo 12s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.15); opacity: 1; }
      }
      @keyframes floatOne {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(40px, 25px); }
      }
      @keyframes floatTwo {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-30px, -20px); }
      }
    </style>
  </defs>

  <!-- Deep Cosmic Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Orbs (Background layer) -->
  <g opacity="0.35">
    <circle class="orb-float-1" cx="200" cy="100" r="140" fill="#38bdf8" filter="url(#glow)" />
    <circle class="orb-float-2" cx="1000" cy="320" r="160" fill="#a855f7" filter="url(#glow)" />
    <circle cx="600" cy="210" r="180" fill="#4f46e5" filter="url(#glow)" opacity="0.2"/>
  </g>

  <!-- Subtle Blueprint Pipeline Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="350" y1="0" x2="350" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="850" y1="0" x2="850" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic CI/CD Pipeline Flow Graph in lower area (Non-obstructive) -->
  <g transform="translate(100, 310)">
    <!-- Pipeline Line -->
    <path class="dash-flow" d="M 0 25 L 250 25 L 350 25 L 500 25 L 650 25 L 750 25 L 1000 25" fill="none" stroke="url(#lineGrad)" stroke-width="3" />

    <!-- Step 1: Code / Commit -->
    <g transform="translate(50, 0)">
      <rect x="0" y="5" width="130" height="40" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="25" r="5" fill="#38bdf8" class="node-pulse" />
      <text x="35" y="30" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Source Commit</text>
    </g>

    <!-- Step 2: Build & Matrix -->
    <g transform="translate(300, 0)">
      <rect x="0" y="5" width="130" height="40" rx="20" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="25" r="5" fill="#818cf8" class="node-pulse-delayed" />
      <text x="35" y="30" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Matrix Build</text>
    </g>

    <!-- Step 3: Test & Quality Gate -->
    <g transform="translate(560, 0)">
      <rect x="0" y="5" width="130" height="40" rx="20" fill="#1e293b" stroke="#a855f7" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="25" r="5" fill="#a855f7" class="node-pulse" />
      <text x="35" y="30" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Quality Gate</text>
    </g>

    <!-- Step 4: Deploy & Delivery -->
    <g transform="translate(810, 0)">
      <rect x="0" y="5" width="140" height="40" rx="20" fill="#1e293b" stroke="#34d399" stroke-width="1.5" opacity="0.9" />
      <circle cx="20" cy="25" r="5" fill="#34d399" class="node-pulse-delayed" />
      <text x="35" y="30" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Deploy Production</text>
    </g>
  </g>

  <!-- Badges / Tech Feature Pills -->
  <g transform="translate(340, 48)">
    <rect x="0" y="0" width="110" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.8"/>
    <text x="15" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">⚡ CONTINUOUS CI</text>

    <rect x="125" y="0" width="115" height="26" rx="13" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.8"/>
    <text x="140" y="17" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🚀 AUTOMATED CD</text>

    <rect x="255" y="0" width="125" height="26" rx="13" fill="#1e293b" stroke="#a855f7" stroke-width="1" opacity="0.8"/>
    <text x="270" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">📦 BUILD ENGINES</text>

    <rect x="395" y="0" width="125" height="26" rx="13" fill="#1e293b" stroke="#34d399" stroke-width="1" opacity="0.8"/>
    <text x="410" y="17" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">🌐 CLOUD & HYBRID</text>
  </g>

  <!-- Foreground Title and Subtitle (Crisp, High Contrast, Prominent) -->
  <!-- Main Title -->
  <text x="600" y="145" text-anchor="middle" fill="url(#primaryGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
    Awesome CI/CD &amp; Build Integrations
  </text>

  <!-- Subtitle -->
  <text x="600" y="195" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
    Curated Hub of Leading SaaS Platforms &amp; High-Performance Open-Source Orchestrators
  </text>

  <!-- Sub-tagline -->
  <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
    Continuous Integration • Automated Delivery • Distributed Runners • Cloud &amp; Self-Hosted Toolchains
  </text>
</svg>